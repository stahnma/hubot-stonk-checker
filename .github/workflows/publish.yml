name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          # Optional: only needed if trusted publishing is not configured on npmjs.com
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
